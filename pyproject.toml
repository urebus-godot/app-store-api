[project]
name = "app-store-api"
version = "1.0"
description = "REST API of the web store where you can purchase and upload apps"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "celery>=5.6.3",
    "fastapi[standard]>=0.136.3",
    "fastapi-mail>=1.6.4",
    "pwdlib[argon2]>=0.3.0",
    "pyjwt>=2.13.0",
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "redis>=8.0.0",
    "sqlmodel>=0.0.38",
    "uvicorn[standard]>=0.49.0",
    "sqlalchemy>=2.0.50",
    "alembic-postgresql-enum>=1.10.0",
    "pydantic-settings>=2.14.1",
    "pytest-mock>=3.15.1",
    "fakeredis[lua]>=2.36.2",
    "aiosqlite>=0.22.1",
    "ruff>=0.15.20",
    "pydantic>=2.13.4",
    "pytest-cov>=7.1.0",
    "testcontainers>=4.14.2",
    "pillow>=12.3.0",
    "flower>=2.0.1",
    "psycopg[binary]>=3.3.4",
    "aioboto3>=15.5.0",
    "httpx-ws>=0.9.0",
]

[tool.uv.workspace]
members = [
    "venv",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-s -vv --cov=app"

[tool.coverage.run]
omit = [
    "tests/*",
    "**/__init__.py",
]

[tool.ruff.lint]
extend-select = ["E501"]
ignore = ["F821", "F841"]

[tool.ruff]
line-length  = 79
target-version = "py314"
extend-exclude = ["migrations"]

