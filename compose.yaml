services:
  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    container_name: db
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/postgresql/data
    networks: 
      - app_network
  
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    container_name: redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks: 
      - app_network
  
  redis-commander:
    image: rediscommander/redis-commander:latest
    ports:
      - "8081:8081"
    container_name: redis-com
    restart: unless-stopped
    networks:
      - app_network
    environment:
      - REDIS_HOSTS=local:redis:6379

  celery_worker:
    build:
      context: .
    container_name: worker
    networks:
      - app_network
    volumes:
      - type: bind
        source: app
        target: /src/app

      - type: bind
        source: media
        target: /src/media

    restart: always
    env_file:
      - .env
    depends_on:
      - redis
    command: celery -A app.task_queue.celery_app worker --loglevel=info --logfile=app/worker.log

  celery_beat:
    build:
      context: .
    container_name: beat
    networks:
      - app_network
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - type: bind
        source: app
        target: /src/app
    depends_on:
      - redis
    command: celery -A app.task_queue.celery_app beat --loglevel=info

  celery_flower:
    image: mher/flower:2.0
    container_name: flower
    networks:
      - app_network
    restart: unless-stopped
    ports:
      - "5555:5555"
    env_file:
      - .env
    depends_on:
      - redis
      - celery_worker
    command: celery flower ${REDIS_URL} --port=5555

  web:
    container_name: web
    build:
      context: .
    expose:
      - "8000"
    networks:
      - app_network
    volumes:
      - type: bind
        source: app
        target: /src/app
      
      - type: bind
        source: media
        target: /src/media

    depends_on:
      - db
      - redis
      - nginx
      - minio
    restart: unless-stopped
    env_file:
      - .env
    command: python -m app.main

  nginx:
    container_name: nginx
    image: nginx:alpine
    ports:
      - "80:80"
    networks: 
      - app_network
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: minio-server
    ports:
      - "9000:9000" # S3 API Port
      - "9001:9001" # Web Console UI Port
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server --console-address ":9001" /data
    restart: unless-stopped

networks:
  app_network:
    driver: bridge

volumes:
  db_data:
  redis_data:
  minio_data:
