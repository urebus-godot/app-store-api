services:
  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    container_name: db
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer
    container_name: pgbouncer
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/db
      POOL_MODE: transaction
      DEFAULT_POOL_SIZE: 20
      MIN_POOL_SIZE: 5
      MAX_CLIENT_CONN: 500
      AUTH_TYPE: scram-sha-256
    ports:
      - "6432:5432"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}", "-h", "localhost", "-p", "5432"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server --console-address ":9001" /data
    restart: unless-stopped
    networks:
      - app_network

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    container_name: redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 10s
      retries: 5
    volumes:
      - redis_data:/data
    networks:
      - app_network
  
  redis-commander:
    image: rediscommander/redis-commander:latest
    ports:
      - "8081:8081"
    container_name: redis-com
    restart: unless-stopped
    environment:
      - REDIS_HOSTS=local:redis:6379
    networks:
      - app_network

  celery_flower:
    image: mher/flower:2.0
    container_name: flower
    restart: unless-stopped
    ports:
      - "5555:5555"
    env_file:
      - .env
    depends_on:
      - redis
      - celery_worker
    command: celery flower ${REDIS_URL} --port=5555
    networks:
      - app_network

  prometheus:
    container_name: prom
    image: prom/prometheus:v2.55.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - web
    networks:
      - app_network
  
  grafana:
    container_name: graf
    image: grafana/grafana:11.2.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - app_network

  celery_worker:
    user: "1000:1000"
    build:
      context: .
    container_name: worker
    volumes:
      - ./app:/app/app
      - prom:/tmp/prom
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - redis
    command: celery -A app.task_queue.celery_app worker --loglevel=info
    networks:
      - app_network
    environment:
      PROMETHEUS_MULTIPROC_DIR: /tmp/prom

  celery_beat:
    user: "1000:1000"
    build:
      context: .
    container_name: beat
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./app:/app/app
    depends_on:
      - redis
    command: celery -A app.task_queue.celery_app beat --loglevel=info -s /tmp/celerybeat-schedule
    networks:
      - app_network

  web:
    container_name: web
    build:
      context: .
    expose:
      - "8000"
    user: "1000:1000"
    volumes:
      - ./app:/app/app
      - prom:/tmp/prom
    depends_on:
      pgbouncer:
        condition: service_healthy
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PROMETHEUS_MULTIPROC_DIR: /tmp/prom
      WATCHFILES_FORCE_POLLING: true
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=*
    networks:
      - app_network

  nginx:
    container_name: nginx
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    restart: unless-stopped
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  db_data:
  redis_data:
  minio_data:
  grafana_data:
  prom:
